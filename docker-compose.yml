version: '3.8'

services:
  # PostgreSQL Databases
  postgres-users:
    image: postgres:15
    environment:
      POSTGRES_DB: bhavishyam_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
      - ./docker/init-users.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhavishyam_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  postgres-markets:
    image: postgres:15
    environment:
      POSTGRES_DB: bhavishyam_markets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-markets-data:/var/lib/postgresql/data
      - ./docker/init-markets.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhavishyam_markets"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  postgres-trading:
    image: postgres:15
    environment:
      POSTGRES_DB: bhavishyam_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-trading-data:/var/lib/postgresql/data
      - ./docker/init-trading.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhavishyam_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  postgres-wallet:
    image: postgres:15
    environment:
      POSTGRES_DB: bhavishyam_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-wallet-data:/var/lib/postgresql/data
      - ./docker/init-wallet.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhavishyam_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Microservices
  user-service:
    build: ./user-service
    depends_on:
      postgres-users:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-users:5432/bhavishyam_users
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8081"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  market-service:
    build: ./market-service
    depends_on:
      postgres-markets:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-markets:5432/bhavishyam_markets
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8082:8082"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  trading-service:
    build: ./trading-service
    depends_on:
      postgres-trading:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-trading:5432/bhavishyam_trading
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  wallet-service:
    build: ./wallet-service
    depends_on:
      postgres-wallet:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-wallet:5432/bhavishyam_wallet
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8083:8083"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - trading-service
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres-users-data:
  postgres-markets-data:
  postgres-trading-data:
  postgres-wallet-data:
