<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#f5d78e"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="88" r="68" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Bottom smile arc -->
  <path d="M 44 138 Q 100 158 156 138" stroke="url(#gold)" stroke-width="1.5" fill="none"/>

  <!-- Left wing outer triangle -->
  <path d="M 100 22 L 38 148 L 72 120 Z" stroke="url(#gold)" stroke-width="1.2" fill="none"/>
  <!-- Left wing inner lines (fan) -->
  <line x1="38" y1="148" x2="72" y2="80"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="38" y1="148" x2="78" y2="65"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="38" y1="148" x2="86" y2="50"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="38" y1="148" x2="93" y2="38"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <!-- Left wing arc lines -->
  <path d="M 50 140 Q 65 125 72 120" stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 44 132 Q 62 112 72 105" stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 42 122 Q 60 100 72 90"  stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- Right wing outer triangle -->
  <path d="M 100 22 L 162 148 L 128 120 Z" stroke="url(#gold)" stroke-width="1.2" fill="none"/>
  <!-- Right wing inner lines (fan) -->
  <line x1="162" y1="148" x2="128" y2="80"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="162" y1="148" x2="122" y2="65"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="162" y1="148" x2="114" y2="50"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <line x1="162" y1="148" x2="107" y2="38"  stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
  <!-- Right wing arc lines -->
  <path d="M 150 140 Q 135 125 128 120" stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 156 132 Q 138 112 128 105" stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 158 122 Q 140 100 128 90"  stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- Center spine -->
  <line x1="100" y1="22" x2="100" y2="148" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Center dots on spine -->
  <circle cx="100" cy="45"  r="2.5" fill="url(#gold)"/>
  <circle cx="100" cy="65"  r="2.5" fill="url(#gold)"/>
  <circle cx="100" cy="85"  r="2.5" fill="url(#gold)"/>
  <circle cx="100" cy="105" r="2.5" fill="url(#gold)"/>
  <circle cx="100" cy="125" r="2.5" fill="url(#gold)"/>

  <!-- Center petal outline -->
  <path d="M 100 22 C 88 55 88 100 100 148 C 112 100 112 55 100 22 Z"
        stroke="url(#gold)" stroke-width="1.2" fill="none"/>
</svg>
